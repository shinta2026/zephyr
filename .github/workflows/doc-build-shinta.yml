
name: Test Workflow

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git Branch"
        required: true
        default: "main"
        type: string

      jenkins_token:
        description: "Jenkins API Token (NOT SECURE)"
        required: true
        default: "09e2b62ca078478d97ea9078f442fcbe"
        type: string

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-24.04

    steps:
      - name: Print message
        run: |
          echo "Hello"
          echo "Workflow triggered successfully"

  validate-github-event:
    name: Validate GitHub Event
    runs-on: ubuntu-24.04

    steps:
      - name: Print Event Details
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "PR Number: $PR_NUMBER"
          echo "PR Head SHA: $PR_HEAD_SHA"

  trigger-jenkins:
    needs: hello
    runs-on: [self-hosted, linux, x64, jenkins-internal]

    steps:
      - name: Trigger Jenkins
        shell: bash
        env:
          JENKINS_USER: "Admin"
          JENKINS_TOKEN: ${{ inputs.jenkins_token }}
          GIT_BRANCH: ${{ inputs.branch }}

        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            --request POST \
            --data-urlencode "GIT_REPO=https://github.com/shinta2026/imaging_fusa_test_automation" \
            --data-urlencode "BRANCH=$GIT_BRANCH" \
            --data-urlencode "EMAIL_TO=shinta.zachariah@neurealm.com" \
            "http://10.201.0.17:8080/job/imaging_fusa_automation_test/buildWithParameters"

          echo "Jenkins build request accepted"