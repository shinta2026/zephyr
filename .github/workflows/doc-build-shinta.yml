
name: Test Workflow

on:
  workflow_dispatch:

  pull_request_target:
    branches:
      - v4.4.0-ti-next_shinta
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-24.04

    steps:
      - name: Print message
        run: |
          echo "Hello"
          echo "Workflow triggered successfully"

  validate-github-event:
    name: Validate GitHub Event
    runs-on: ubuntu-24.04

    steps:
      - name: Print Event Details
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        run: |
          echo "Event: $EVENT_NAME"
          echo "PR Action: $PR_ACTION"
          echo "PR Number: $PR_NUMBER"
          echo "PR Branch: $PR_HEAD_BRANCH"
          echo "PR Head SHA: $PR_HEAD_SHA"

  trigger-jenkins:
    needs:
      - hello
      - validate-github-event

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, linux, x64, jenkins-internal]

    steps:
      - name: Trigger Jenkins
        shell: bash

        env:
          JENKINS_USER: "Admin"
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        run: |
          set -euo pipefail

          # Check Jenkins token from runner environment
          if [[ -z "${JENKINS_TOKEN:-}" ]]; then
            echo "ERROR: JENKINS_TOKEN is not available"
            exit 1
          fi

          # Determine branch based on trigger type
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            GIT_BRANCH="main"
            COMMIT_SHA="$PR_HEAD_SHA"
          else
            GIT_BRANCH="main"
            COMMIT_SHA=""
          fi

          echo "Event: $GITHUB_EVENT_NAME"
          echo "PR Action: $PR_ACTION"
          echo "PR Number: $PR_NUMBER"
          echo "PR Branch: $PR_HEAD_BRANCH"
          echo "Branch sent to Jenkins: $GIT_BRANCH"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Jenkins User: $JENKINS_USER"

          # Trigger Jenkins pipeline
          curl --fail-with-body --silent --show-error \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            --request POST \
            --data-urlencode "GIT_REPO=https://github.com/shinta2026/imaging_fusa_test_automation" \
            --data-urlencode "BRANCH=$GIT_BRANCH" \
            --data-urlencode "COMMIT_SHA=$COMMIT_SHA" \
            --data-urlencode "EMAIL_TO=shinta.zachariah@neurealm.com" \
            "http://10.201.0.17:8080/job/imaging_fusa_automation_test/buildWithParameters"

          echo "Jenkins build request accepted"
